[package]
name = "sviewer"
version = "0.0.1"
authors = ["while"]
edition = "2021"

[lib]
name = "sviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset：允许前端通过 convertFileSrc 经 asset:// 直接读取本地图片
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
# 单实例：双击第二张图时不再开新进程，而是把路径转交给已运行的窗口
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# 图片解码 / 尺寸读取（jpg/png/gif/webp/bmp/tiff/ico 等）。HEIC 需 native libheif，暂不支持。
image = "0.25"
# EXIF 读取（crate 包名 kamadak-exif，import 名为 exif）
kamadak-exif = "0.6"
base64 = "0.22"

# 仅 Windows：把 SViewer 注册进系统「打开方式 / 默认应用」（写 HKCU，免管理员）
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# 原生 HEIC 解码（WIC）：版本与 tauri 依赖树对齐，避免重复编译
windows = { version = "0.61", features = ["Win32_Graphics_Imaging", "Win32_System_Com"] }
